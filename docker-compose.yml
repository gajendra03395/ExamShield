services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: examshield
      POSTGRES_USER: examshield
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - examshield_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U examshield -d examshield"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://examshield:${POSTGRES_PASSWORD}@postgres:5432/examshield?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (at least 32 random characters)}
      ADMIN_BOOTSTRAP_TOKEN: ${ADMIN_BOOTSTRAP_TOKEN:-}
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "npx prisma db push && npm run dev"]

  web-panel:
    build:
      context: .
      dockerfile: web-panel/Dockerfile
    environment:
      VITE_API_PROXY: http://backend:5000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend

volumes:
  examshield_postgres:
